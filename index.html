<!DOCTYPE html>
<html lang="pl">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>MODI PS3 Flash - logowanie</title>
  <style type="text/css">
    body { margin: 0; background: #101722; color: #fff; font: 20px Arial, sans-serif; }
    #login { width: 82%; max-width: 480px; margin: 60px auto; padding: 24px; background: #1d2939; border: 1px solid #526277; }
    h1 { margin: 0 0 12px; font-size: 30px; }
    p { line-height: 1.5; }
    label { display: block; margin: 24px 0 8px; }
    input { width: 90%; padding: 12px; font: 24px Arial, sans-serif; background: #fff; color: #101722; border: 2px solid #8195ad; }
    button { margin-top: 20px; padding: 12px 28px; color: #fff; background: #1558a6; border: 2px solid #74b5ff; font: 22px Arial, sans-serif; cursor: pointer; }
    #error { color: #ffb8b8; min-height: 30px; }
  </style>
  <script type="text/javascript">
    function accessCodeHash(value) {
      var hash = 5381;
      var i;
      for (i = 0; i < value.length; i++) {
        hash = (((hash << 5) + hash) ^ value.charCodeAt(i)) >>> 0;
      }
      return hash;
    }
    function login() {
      var field = document.getElementById('password');
      var code = field.value;
      if (/^[0-9]{6}$/.test(code) && accessCodeHash(code) === 3830772650) {
        field.value = '';
        window.location.replace('writer/');
      } else {
        document.getElementById('error').innerHTML = 'Nieprawidłowe hasło. Spróbuj ponownie.';
        field.value = '';
        field.focus();
      }
      return false;
    }
  </script>
</head>
<body>
  <div id="login">
    <h1>MODI PS3 Flash</h1>
    <p>Dostęp serwisowy · Flash Writer 4.93</p>
    <form action="#" method="get" onsubmit="return login();">
      <label for="password">Hasło</label>
      <input id="password" type="password" maxlength="6" size="6" autocomplete="off">
      <br>
      <button type="submit">Zaloguj</button>
      <p id="error" role="alert" aria-live="polite"></p>
    </form>
    <noscript><p>Włącz JavaScript w przeglądarce, aby się zalogować.</p></noscript>
  </div>
</body>
</html>
